name: Update Daily Predictions

on:
  schedule:
    # src/run_gate.py decides in Eastern time: 10 AM (morning refresh), 11 PM (East games
    # final), 2 AM (West games final), and ~15 min before each distinct tip time (game-time
    # decisions). Each run sleeps until the next slot, runs it, then dispatches itself
    # (chain=true) to wait for the one after. GitHub fires this cron hours apart; it only
    # restarts the chain if a run fails.
    - cron: "*/5 * * * *"
  workflow_dispatch:   # manual trigger from GitHub UI (runs the full pipeline now)
    inputs:
      chain:
        description: "Internal: wait for the next slot instead of running now"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # to dispatch the next link of the chain

concurrency:
  # One sleeping run plus at most one queued; manual runs don't queue behind a sleeping one
  group: update-predictions-${{ (github.event_name == 'schedule' || inputs.chain) && 'auto' || 'manual' }}
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # the gate may sleep up to 5 h

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main   # a queued tick must see slots recorded by the run before it

      - name: Check whether an update slot is due
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.chain }}" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "slots=manual" >> "$GITHUB_OUTPUT"
          else
            python3 src/run_gate.py
          fi

      - name: Set up Python
        if: steps.gate.outputs.run
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run
        run: pip install -r requirements.txt

      - name: Download schedule and latest results
        if: steps.gate.outputs.run
        run: python src/data_download.py

      - name: Run tests
        if: steps.gate.outputs.run
        run: pytest tests/ -q

      - name: Preprocess game data
        if: steps.gate.outputs.run
        run: python src/preprocess.py

      # The model isn't committed (6 MB/day of repo growth); retraining takes seconds.
      - name: Retrain model on latest data
        if: steps.gate.outputs.run
        run: python src/train.py

      - name: Snapshot rosters and injury report
        if: steps.gate.outputs.run
        run: python src/rosters.py
        continue-on-error: true   # keep yesterday's snapshot rather than skip predictions

      - name: Rate rosters (DARKO DPM)
        if: steps.gate.outputs.run
        run: python src/ratings.py
        continue-on-error: true   # falls back to the last saved DARKO pull / BPM

      - name: Re-forecast the season
        if: steps.gate.outputs.run
        run: python src/update_daily.py

      - name: Commit updated data and predictions
        if: steps.gate.outputs.run
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ models/
          git diff --cached --quiet || git commit -m "chore: update predictions (${{ steps.gate.outputs.slots }})"
          git pull --rebase
          git push

      # Not on failure: a failed slot isn't recorded, so the next link would retry it at
      # once; the cron restarts the chain later instead.
      - name: Wait for the next slot in a new run
        if: success() && (github.event_name == 'schedule' || inputs.chain)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update_predictions.yml --ref main -f chain=true
