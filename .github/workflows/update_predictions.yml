name: Update Daily Predictions

on:
  schedule:
    # Morning: 14:00 UTC = 10 AM EDT / 9 AM EST — last night's results are final.
    # Full pipeline: results → retrain → rosters/injuries → re-forecast the season.
    - cron: "0 14 * * *"
    # Evening: 22:00 UTC = 6 PM EDT / 5 PM EST — after official injury reports, before 7 PM tips.
    # Fast path: no new results to download; refresh rosters/injuries and re-forecast.
    - cron: "0 22 * * *"
  workflow_dispatch:   # manual trigger from GitHub UI (runs the full pipeline)

permissions:
  contents: write

concurrency:
  group: update-predictions
  cancel-in-progress: false

env:
  EVENING: ${{ github.event.schedule == '0 22 * * *' }}

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q

      - name: Download schedule and latest results
        if: env.EVENING != 'true'
        run: python src/data_download.py

      - name: Preprocess game data
        run: python src/preprocess.py

      # The model isn't committed (6 MB/day of repo growth); retraining takes seconds.
      - name: Retrain model on latest data
        run: python src/train.py

      - name: Snapshot rosters and injury report
        run: python src/rosters.py
        continue-on-error: true   # keep yesterday's snapshot rather than skip predictions

      - name: Rate rosters (Basketball-Reference BPM)
        run: python src/ratings.py
        continue-on-error: true   # falls back to the cached BPM tables in data/bpm/

      - name: Re-forecast the season
        run: python src/update_daily.py

      - name: Commit updated data and predictions
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ models/
          git diff --cached --quiet || git commit -m "chore: update predictions for $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
